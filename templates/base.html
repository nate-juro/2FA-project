<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Secure Login Demo{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; color: #222; }
    input { display: block; width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    .flash { background: #fff3cd; border: 1px solid #ffe69c; padding: 10px; margin-bottom: 14px; border-radius: 4px; }
    label { font-size: 14px; color: #555; }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
